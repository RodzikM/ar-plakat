<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image.prod.js"></script>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <script>
      AFRAME.registerComponent('outline', {
        schema: {
          color: {type: 'color', default: '#000000'},
          thickness: {type: 'number', default: 0.02} // Zmień tę wartość, by pogrubić lub pocienić obrys
        },
        init: function () {
          // Czekamy, aż model całkowicie się załaduje
          this.el.addEventListener('model-loaded', () => {
            const mesh = this.el.getObject3D('mesh');
            if (!mesh) return;

            // Tworzymy materiał shadera (odwrócona skorupa)
            const material = new THREE.ShaderMaterial({
              uniforms: {
                color: { value: new THREE.Color(this.data.color) },
                thickness: { value: this.data.thickness }
              },
              vertexShader: `
                uniform float thickness;
                void main() {
                  // Wypychamy geometrię wzdłuż jej wektorów normalnych
                  vec3 pos = position + normal * thickness;
                  gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                }
              `,
              fragmentShader: `
                uniform vec3 color;
                void main() {
                  gl_FragColor = vec4(color, 1.0);
                }
              `,
              side: THREE.BackSide // Ukrywa przód, pokazuje tylko tył (kluczowe dla obrysu!)
            });

            // Przeszukujemy model i nakładamy obrys na każdą jego część
            const outlines = [];
            mesh.traverse((node) => {
              if (node.isMesh) {
                const outline = new THREE.Mesh(node.geometry, material);
                outlines.push({parent: node, outline: outline});
              }
            });
            
            // Dodajemy wygenerowany obrys do modelu
            outlines.forEach(obj => {
              obj.parent.add(obj.outline);
            });
          });
        }
      });
    </script>

    <style>
      body {margin: 0;}
      #container {width: 100vw; height: 100vh; position: relative; overflow: hidden;}

/* STYLIZACJA NASZEGO NAPISU NA EKRANIE */
      #ui-tekst {
        position: absolute;
        bottom: 12%; /* Umieszcza napis lekko nad dolną krawędzią ekranu */
        left: 50%;
        transform: translateX(-50%); /* Idealne wyśrodkowanie poziome */
        z-index: 1000; /* Gwarantuje, że napis jest NAD kamerą i modelem 3D */
        background-color: rgba(0, 0, 0, 0.7); /* Półprzezroczyste czarne tło */
        color: white; /* Biały kolor liter */
        padding: 12px 24px;
        border-radius: 8px; /* Zaokrąglone rogi tła */
        font-family: Arial, sans-serif;
        font-size: 18px;
        text-align: center;
        pointer-events: none; /* Sprawia, że napis "przepuszcza" dotyk, nie blokuje ekranu */
        transition: opacity 0.4s ease; /* Zapewnia płynne znikanie napisu */
      }
    </style>
  </head>
  <body>
    <div id="container">

      <!-- NASZ NAPIS -->
      <div id="ui-tekst">Nakieruj aparat na obrazek</div>
      
      <a-scene mindar-image="imageTargetSrc: targets.mind; filterMinCF: 0.001; filterBeta: 0.001;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        
        <a-assets>
          <a-asset-item id="myModel" src="model.glb"></a-asset-item>
          <a-asset-item id="myModel2" src="platew.glb"></a-asset-item>
          <a-asset-item id="myModel3" src="krokiewka.glb"></a-asset-item>
        </a-assets>
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity light="type: ambient; intensity: 0.8;"></a-entity>
        <a-entity light="type: directional; position: 0 1 1; intensity: 0.5"></a-entity>
        
        <a-entity mindar-image-target="targetIndex: 0">
          
          <a-gltf-model 
            src="#myModel" 
            position="0 0 0" 
            rotation="0 0 0" 
            scale="0.1 0.1 0.1"
            outline="color: #000000; thickness: 0.02"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 30000; easing: linear;">
          </a-gltf-model>
          
        </a-entity>

        <a-entity mindar-image-target="targetIndex: 1">
          
          <a-gltf-model 
            src="#myModel2" 
            position="0 0 0" 
            rotation="0 0 0" 
            scale="2 2 2"
            outline="color: #000000; thickness: 0.005"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear;">
          </a-gltf-model>
          
        </a-entity>

        <a-entity mindar-image-target="targetIndex: 2">
          
          <a-gltf-model 
            src="#myModel3" 
            position="0 -0.98 0" 
            rotation="0 0 0" 
            scale="1.5 1.5 1.5"
            outline="color: #000000; thickness: 0.005"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear;">
          </a-gltf-model>
          
        </a-entity>
      </a-scene>
      
    </div>
    
    <!-- SKRYPT UKRYWAJĄCY NAPIS PO WYKRYCIU OBRAZKA -->
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        const uiTekst = document.querySelector('#ui-tekst');
        const targets = document.querySelectorAll('[mindar-image-target]');
        
        targets.forEach(target => {
          // Kiedy kamera znajdzie jakikolwiek obrazek:
          target.addEventListener("targetFound", () => {
            uiTekst.style.opacity = "0"; 
          });
          // Kiedy kamera zgubi obrazek:
          target.addEventListener("targetLost", () => {
            uiTekst.style.opacity = "1"; 
          });
        });
      });
    </script>

  </body>
</html>
